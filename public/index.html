<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121417">
    <title>Hebrew Swipe Annotator</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="progress-copy">
          <span id="progressText">Loading...</span>
          <span id="remainingText"></span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </header>

      <section id="reviewStage" class="review-stage" aria-live="polite">
        <div id="card" class="image-card">
          <div class="prompt-wrap">
            <p id="prompt" class="prompt" dir="rtl">...</p>
            <p id="filename" class="filename" dir="auto"></p>
          </div>
          <div id="imageFrame" class="image-frame">
            <img id="image" alt="">
            <div id="dragCue" class="drag-cue"></div>
          </div>
          <div id="metadata" class="metadata"></div>
        </div>
      </section>

      <section id="doneState" class="done-state" hidden>
        <h1>Done</h1>
        <p>All visible images have labels in the CSV.</p>
        <a class="export-link" href="/api/export.csv">Export CSV</a>
      </section>

      <section id="commentPanel" class="comment-panel" hidden>
        <div class="comment-header">
          <span id="reviewStatus">Review comments</span>
          <span id="reviewLabel"></span>
        </div>
        <textarea id="commentText" maxlength="4000" placeholder="Describe what should be fixed before regenerating this image"></textarea>
      </section>

      <nav class="action-bar" aria-label="Annotation actions">
        <div class="utility-row">
          <button id="skipButton" class="utility-button skip-button" type="button">Skip</button>
          <button id="undoButton" class="utility-button" type="button" disabled>Undo</button>
          <button id="reviewButton" class="utility-button" type="button">Review</button>
          <a class="utility-button export-button" href="/api/export.csv">CSV</a>
        </div>
        <div class="decision-row">
          <button id="noButton" class="decision-button decision-no" type="button">No</button>
          <button id="yesButton" class="decision-button decision-yes" type="button">Yes</button>
        </div>
      </nav>

      <nav id="reviewBar" class="review-bar" aria-label="Comment review actions" hidden>
        <button id="annotateButton" class="utility-button" type="button">Annotate</button>
        <button id="nextReviewButton" class="utility-button" type="button">Next</button>
        <button id="saveCommentButton" class="decision-button decision-yes" type="button">Save & Next</button>
      </nav>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
